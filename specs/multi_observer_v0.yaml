version: 0.1

fusion_trigger_score: 7

risk_weights:
  paid_delivery: 3
  public_release: 2
  legal_or_money: 3
  security: 3
  unclear_requirements: 2
  multi_domain: 2
  model_disagreement: 2
  high_failure_cost: 2

blocklist:
  - simple_rewrite
  - memo_cleanup
  - x_post_generation
  - draft_only
  - trivial_code_edit

observers:
  default:
    provider: nvidia_nim
    role: cheap_observer

  fusion:
    provider: open_router
    model: openrouter/fusion
    role: special_observer

logging:
  path: logs/observer_decisions.jsonl
